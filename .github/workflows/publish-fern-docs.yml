# Publishes the Fern documentation site on GitHub Release or manual dispatch.
#
# Version content is fetched from release tags at publish time by
# scripts/docs-fetch-versions.py, which reads fern/kept-versions.json to
# determine how many major.minor version groups to keep (default: 2).
# Adding a new minor release (e.g. v1.4.0) automatically rotates the oldest
# version out — no manual changes to fern/docs.yml are needed.
#
# The committed fern/docs.yml uses a flat `navigation:` pointing at HEAD docs
# (for fern check and local dev). This workflow replaces that block in-runner
# with a versioned `versions:` list built from the tag manifest, then restores
# the original after publishing.
#
# Pre-release tags (e.g. v1.3.2-rc.1) are skipped — only stable releases and
# manual workflow_dispatch trigger a publish.
#
# Required configuration:
# - Organization secret: DOCS_FERN_TOKEN (from `fern token` for the nvidia Fern org)

name: Publish Fern Docs

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: fern-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # runs-on: linux-amd64-cpu8  # NVIDIA self-hosted runner
    timeout-minutes: 20
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Install Fern CLI
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version fern/fern.config.json)
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "::error::fern.config.json .version '$VERSION' is not a valid semver"
            exit 1
          fi
          npm install -g "fern-api@${VERSION}"

      - name: Fetch versioned docs from tags
        run: python3 scripts/docs-fetch-versions.py

      - name: Patch fern/docs.yml for versioned publish
        run: |
          cp fern/docs.yml fern/docs.yml.bak
          python3 - <<'PYEOF'
          import json, re
          from pathlib import Path

          manifest = json.loads(Path("fern/versions/manifest.json").read_text())

          versions_lines = ["versions:"]
          for v in manifest:
              versions_lines += [
                  f'  - display-name: "{v["display_name"]}"',
                  f'    path: {v["nav_path"]}',
                  f'    slug: "{v["slug"]}"',
              ]
          versions_block = "\n".join(versions_lines) + "\n"

          content = Path("fern/docs.yml").read_text()
          # Replace the navigation: block (HEAD mode) with versions: (publish mode)
          patched = re.sub(
              r"^navigation:(\n  .*)*\n",
              versions_block,
              content,
              flags=re.MULTILINE,
          )
          Path("fern/docs.yml").write_text(patched)
          PYEOF

      - name: Publish docs
        env:
          FERN_TOKEN: ${{ secrets.DOCS_FERN_TOKEN }}
        run: |
          set -euo pipefail
          fern generate --docs 2>&1 | tee /tmp/fern-output.log
          URL=$(grep -oP 'Published docs to \K.*(?= \()' /tmp/fern-output.log || true)
          if [ -z "$URL" ]; then
            echo "::error::Fern did not emit a published URL — verify the publish succeeded"
            exit 1
          fi
          echo "### Published: [$URL]($URL)" >> "$GITHUB_STEP_SUMMARY"

      - name: Restore fern/docs.yml
        if: always()
        run: |
          if [ -f fern/docs.yml.bak ]; then
            mv fern/docs.yml.bak fern/docs.yml
          fi
