name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, for example v1.6.0 or v1.6.0-rc.1'
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-artifacts
  cancel-in-progress: false

env:
  NGC_NAMESPACE: ${{ vars.NGC_NAMESPACE }}
  VERSION_TAG: ${{ inputs.version }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set release version
        id: version
        run: |
          set -euo pipefail
          if [[ ! "$VERSION_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release version must be vMAJOR.MINOR.PATCH with an optional prerelease suffix"
            exit 1
          fi
          : "${NGC_NAMESPACE:?NGC_NAMESPACE is required}"
          printf 'version=%s\n' "${VERSION_TAG#v}" >> "$GITHUB_OUTPUT"
          printf 'VERSION=%s\n' "${VERSION_TAG#v}" >> "$GITHUB_ENV"
          printf 'timestamp=%s\n' "$(git show -s --format=%cI HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Log in to NGC
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: nvcr.io
          username: '$oauthtoken'
          password: ${{ secrets.NGC_API_KEY }}
      - name: Publish agent image
        id: agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nvcr.io/${{ vars.NGC_NAMESPACE }}/agent:${{ steps.version.outputs.version }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_TIMESTAMP=${{ steps.version.outputs.timestamp }}
          provenance: mode=max,version=v1
          sbom: true
      - name: Attest agent image
        id: agent_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: nvcr.io/${{ vars.NGC_NAMESPACE }}/agent
          subject-digest: ${{ steps.agent.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Publish gateway image
        id: gateway
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./otelcol/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: nvcr.io/${{ vars.NGC_NAMESPACE }}/otel-gateway:${{ steps.version.outputs.version }}
          provenance: mode=max,version=v1
          sbom: true
      - name: Attest gateway image
        id: gateway_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: nvcr.io/${{ vars.NGC_NAMESPACE }}/otel-gateway
          subject-digest: ${{ steps.gateway.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.17.3
      - name: Package chart
        run: |
          set -euo pipefail
          helm lint deployments/helm/fleet-intelligence-agent
          cp LICENSE deployments/helm/fleet-intelligence-agent/LICENSE
          helm package deployments/helm/fleet-intelligence-agent --version "$VERSION" --app-version "$VERSION" --destination dist
          cd dist
      - name: Attest chart
        id: chart_provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/fleet-intelligence-agent-${{ steps.version.outputs.version }}.tgz
      - name: Install pinned NGC CLI
        env:
          NGC_CLI_VERSION: '4.36.6'
          NGC_CLI_SHA256: '2972dbe54e80cedae18e82923a9a67a60aef23d041c5790336f8f4b51752bab6'
        run: |
          set -euo pipefail
          ngc_dir=$(mktemp -d "$RUNNER_TEMP/ngc-cli.XXXXXX")
          ngc_home=$(mktemp -d "$RUNNER_TEMP/ngc-home.XXXXXX")
          printf 'NGC_CLI_HOME=%s\n' "$ngc_home" >> "$GITHUB_ENV"
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            -o "$ngc_dir/ngccli_linux.zip" \
            "https://api.ngc.nvidia.com/v2/resources/nvidia/ngc-apps/ngc_cli/versions/${NGC_CLI_VERSION}/files/ngccli_linux.zip"
          printf '%s  %s\n' "$NGC_CLI_SHA256" "$ngc_dir/ngccli_linux.zip" | sha256sum --check -
          unzip -q "$ngc_dir/ngccli_linux.zip" -d "$ngc_dir"
          chmod +x "$ngc_dir/ngc-cli/ngc"
          printf '%s\n' "$ngc_dir/ngc-cli" >> "$GITHUB_PATH"
          NGC_CLI_HOME="$ngc_home" "$ngc_dir/ngc-cli/ngc" --version
      - name: Publish chart
        env:
          NGC_CLI_API_KEY: ${{ secrets.NGC_API_KEY }}
          CHART_TARGET: ${{ vars.NGC_NAMESPACE }}/fleet-intelligence-agent
        run: |
          set -euo pipefail
          cd dist
          if ! ngc registry chart info "$CHART_TARGET"; then
            ngc registry chart create "$CHART_TARGET" --short-desc "Fleet Intelligence Agent and telemetry gateway"
          fi
          ngc registry chart push "$CHART_TARGET:$VERSION"
      - name: Remove NGC CLI state
        if: always()
        run: |
          if [[ -n "${NGC_CLI_HOME:-}" ]]; then
            rm -rf "$NGC_CLI_HOME"
          fi
