# OTel Gateway Collector configuration for fleet-intelligence-agent.
#
# Deployment model:
#
#   Agents ──► Gateway Collector (SAK→JWT) ──► Backend
#                      │
#                      ├──► Prometheus remote write  (optional)
#                      └──► Any other OTLP exporter  (optional)
#
# The gateway holds a service-level SAK and handles all backend authentication.
# It enrolls once with a service-level identity and forwards all OTLP with that
# identity. Agents remain identifiable through machine.id and other OTLP
# resource attributes.
# The gateway relies on Kubernetes ClusterIP network isolation for inbound security.
#
# Required environment variables:
#   ENROLL_ENDPOINT  - Backend enrollment URL (e.g. https://backend/api/v1/agent/enroll)
#   SAK_TOKEN        - Service API Key sent as Authorization: Bearer on enrollment
#   BACKEND_ENDPOINT - Backend OTLP HTTP base URL (e.g. https://backend/api/v1/health)

extensions:
  # Fleet Intelligence auth: enrolls with the backend using the SAK token, extracts
  # the customer ID from the returned JWT, and refreshes the JWT proactively via
  # response headers and on 401 as a fallback.
  sakauth:
    enroll_endpoint: ${env:ENROLL_ENDPOINT}
    sak_token: ${env:SAK_TOKEN}

  # Health check endpoint used by liveness/readiness probes.
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        # No inbound auth: the gateway is a ClusterIP service accessible only
        # within the cluster. Cluster network isolation is the security boundary.
        # The gateway uses its own SAK JWT when forwarding to the backend.
        # Agent identity flows through OTLP resource attributes (machine.id, GPU UUIDs).
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 400
    spike_limit_mib: 100

  batch:
    timeout: 10s
    send_batch_size: 1000

exporters:
  otlp_http/backend:
    metrics_endpoint: ${env:BACKEND_ENDPOINT}/metrics
    logs_endpoint: ${env:BACKEND_ENDPOINT}/logs
    compression: none
    auth:
      authenticator: sakauth
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000

  # Optional: uncomment to also fan out to Prometheus remote write.
  # prometheusremotewrite/monitoring:
  #   endpoint: ${env:PROMETHEUS_REMOTE_WRITE_URL}

  # Optional: uncomment to fan out logs to Loki.
  # loki/monitoring:
  #   endpoint: ${env:LOKI_ENDPOINT}

service:
  extensions: [sakauth, health_check]
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/backend]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/backend]
  telemetry:
    logs:
      level: warn
