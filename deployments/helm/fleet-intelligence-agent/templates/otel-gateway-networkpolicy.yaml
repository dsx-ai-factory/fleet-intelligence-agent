{{- if and .Values.otelGateway.enabled .Values.otelGateway.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleet-intelligence-agent.fullname" . }}-otel-gateway
  labels:
    {{- include "fleet-intelligence-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-gateway
spec:
  podSelector:
    matchLabels:
      {{- include "fleet-intelligence-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: otel-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "fleet-intelligence-agent.selectorLabels" . | nindent 14 }}
      ports:
        - protocol: TCP
          port: {{ .Values.otelGateway.service.port }}
{{- end }}
